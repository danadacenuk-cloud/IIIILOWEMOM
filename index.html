<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МАМА Я ТЕБЕ ЛЮБЛЮ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      width: 100vw;
      height: 100vh;
    }

    .word {
      position: absolute;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 900;
      user-select: none;
      white-space: nowrap;
    }

    #w1 {
      color: #ff4b4b;
      text-shadow: 0 0 20px rgba(255, 75, 75, 0.8);
    }

    #w2 {
      color: #ff85a2;
      text-shadow: 0 0 20px rgba(255, 133, 162, 0.8);
    }

    #w3 {
      color: #ff0055;
      text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
    }
  </style>
</head>
<body>

  <div id="w1" class="word">МАМА</div>
  <div id="w2" class="word">Я ТЕБЕ</div>
  <div id="w3" class="word">ЛЮБЛЮ</div>

  <script>
    const items = [
      { el: document.getElementById('w1'), x: 20, y: 30, vx: 2, vy: 1.8 },
      { el: document.getElementById('w2'), x: 100, y: 150, vx: -1.7, vy: 2.2 },
      { el: document.getElementById('w3'), x: 180, y: 300, vx: 2.3, vy: -1.6 }
    ];

    function animate() {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      items.forEach(item => {
        const width = item.el.offsetWidth;
        const height = item.el.offsetHeight;

        item.x += item.vx;
        item.y += item.vy;

        if (item.x + width >= screenWidth || item.x <= 0) {
          item.vx = -item.vx;
        }
        if (item.y + height >= screenHeight || item.y <= 0) {
          item.vy = -item.vy;
        }

        item.el.style.left = item.x + 'px';
        item.el.style.top = item.y + 'px';
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
